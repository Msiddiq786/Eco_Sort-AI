services:
  - type: web
    name: ecosort-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/waste_segregation.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: AUTO_DOWNLOAD_MODELS
        value: "true"
      - key: VIT_HF_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false
    disk:
      name: ecosort-storage
      mountPath: /data
      sizeGB: 2
