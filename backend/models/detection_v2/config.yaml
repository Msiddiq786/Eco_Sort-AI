# EcoSort AI V2 — Dedicated Waste Object Detection Configuration
model:
  architecture: "YOLOv8n"
  weights_dir: "models/detection_v2/weights"
  best_weights: "models/detection_v2/weights/best.pt"
  input_size: [640, 640]
  confidence_threshold: 0.35
  iou_threshold: 0.40
  max_detections: 25
  classes:
    0: "cardboard"
    1: "glass"
    2: "metal"
    3: "paper"
    4: "plastic"
    5: "organic"
    6: "trash"

dataset:
  source: "TACO (Trash Annotations in Context)"
  format: "COCO / YOLO format"
  train_split: "backend/data/detection/train"
  val_split: "backend/data/detection/val"
  test_split: "backend/data/detection/test"

training:
  epochs: 50
  batch_size: 16
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 10
  save_period: 5

status:
  detector_status: "AWAITING_TRAINING"
  notes: "V1 6-class ViT fine-tuning is currently active on CPU. Detector fine-tuning is staged and will be launched once V1 concludes."
