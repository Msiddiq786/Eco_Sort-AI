# ── Training & Dataset Configuration for EcoSort AI ─────────────────
# Smart Waste Segregation Using Vision Transformer Ensemble

classes:
  - cardboard
  - glass
  - metal
  - paper
  - plastic
  - trash

model:
  checkpoint: "google/vit-base-patch16-224-in21k"
  num_labels: 6
  image_size: 224
  label_names:
    - cardboard
    - glass
    - metal
    - paper
    - plastic
    - trash

training:
  epochs: 20
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_clip: 1.0
  early_stopping_patience: 5
  gradient_accumulation_steps: 1
  mixed_precision: true
  metric_for_best_model: "accuracy"  # "accuracy" or "f1_score"
  random_seed: 42

data:
  raw_dir: "backend/data/raw"
  train_dir: "backend/data/train"
  val_dir: "backend/data/val"
  test_dir: "backend/data/test"
  splits_summary_path: "backend/data/splits_summary.json"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  image_size: 224
  batch_size: 32
  num_workers: 0

normalization:
  # ImageNet normalization for ViT (google/vit-base-patch16-224-in21k)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  random_horizontal_flip: true
  horizontal_flip_prob: 0.5
  random_rotation: 15
  random_crop_scale: [0.85, 1.0]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  random_erasing: false
  random_erasing_prob: 0.1

checkpoint:
  save_dir: "backend/models/vit/best"
  final_save_dir: "backend/models/vit/final"
  best_model_name: "vit_waste_best"

evaluation:
  results_dir: "backend/evaluation/results"
  metrics_file: "metrics.json"
  history_file: "training_history.json"
  confusion_matrix_file: "confusion_matrix.json"
  averaging: "macro"

clip:
  model_name: "openai/clip-vit-base-patch32"
  enabled: true

ensemble:
  vit_weight: 0.70
  clip_weight: 0.30
